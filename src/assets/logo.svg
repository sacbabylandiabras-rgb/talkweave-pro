<svg width="100%" viewBox="0 0 690 320" role="img" xmlns="http://www.w3.org/2000/svg" style="">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">ZapLynx Logo</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Logo da ZapLynx com ícone de relâmpago e tipografia moderna em gradiente roxo e rosa</desc>
<defs>
  <linearGradient id="gradMain" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#a78bfa"/>
    <stop offset="100%" stop-color="#f472b6"/>
  </linearGradient>
  <linearGradient id="gradBolt" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#c4b5fd"/>
    <stop offset="100%" stop-color="#f472b6"/>
  </linearGradient>
  <linearGradient id="gradGlow" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#db2777" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1a1040"/>
    <stop offset="100%" stop-color="#0f0c29"/>
  </linearGradient>
  <radialGradient id="glowLeft" cx="30%" cy="40%" r="50%">
    <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowRight" cx="70%" cy="60%" r="50%">
    <stop offset="0%" stop-color="#db2777" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#db2777" stop-opacity="0"/>
  </radialGradient>
  <filter id="softBlur">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
<mask id="imagine-text-gaps-odyzmw" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="690" height="320" fill="white"/><rect x="214" y="53" width="212.5625" height="128" fill="black" rx="2"/><rect x="401.8999938964844" y="53" width="282.1094055175781" height="128" fill="black" rx="2"/><rect x="216" y="172" width="293.84375" height="19" fill="black" rx="2"/></mask></defs>

<!-- Background card -->
<rect x="40" y="30" width="600" height="260" rx="24" fill="url(#gradBg)" style="stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<!-- Glow blobs -->
<ellipse cx="200" cy="140" rx="160" ry="120" fill="url(#glowLeft)" filter="url(#softBlur)" style="stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
