  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #EF4444; --primary-fg: #fff; --bg: #EFF1F5; --card-bg: #fff;
      --text: #1F2937; --text-muted: #6B7280; --border: #E5E7EB;

      --input-bg: #fff; --input-border: #D1D5DB;
      --card-title: #111827; --card-desc: #6B7280; --card-label: #6B7280; --card-text: #1F2937;
      --step-bg: #EF4444; --step-text: #fff; --btn-color: #EF4444;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
    .loader-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
    .error-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; }
    .error-wrap h2 { font-size: 1.15rem; font-weight: 600; }
    .error-wrap p { font-size: .85rem; color: var(--text-muted); }

    /* Timer Banner */
    .timer-banner { width: 100%; text-align: center; padding: 12px; font-size: .875rem; font-weight: 500; background: var(--primary); color: #fff; }
    .timer-banner b { margin-left: 4px; }

    /* Logo Header */
    .logo-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--card-bg); border-bottom: 1px solid var(--border); }
    .logo-header img { height: 32px; width: auto; object-fit: contain; }
    .logo-header .safe { display: flex; align-items: center; gap: 4px; font-size: .7rem; font-weight: 500; color: #16A34A; }

    /* Container */
    .co { max-width: 32rem; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 16px; }
    /* 2-col layout */
    .layout-2col { max-width: 56rem; margin: 0 auto; padding: 24px 16px; display: flex; gap: 20px; }
    .layout-2col .col-main { flex: 1; display: flex; flex-direction: column; gap: 16px; }
    .layout-2col .col-side { width: 260px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px; }
    @media (max-width: 768px) {

      .layout-2col .col-side { width: 100%; }
      .steps, .step-tabs { display: none !important; }
    }

    /* Steps */
    .steps { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 0; }
    .step-item { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
    .step-c { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: var(--step-radius); transition: all .3s; }
    .step-l { font-size: 10px; font-weight: 600; }
    .step-sep { width: 32px; height: 2px; border-radius: 1px; margin-bottom: 20px; }

    /* Horizontal steps (tabs) */
    .step-tabs { display: flex; border: 1px solid var(--border); border-radius: var(--card-radius); overflow: hidden; background: var(--card-bg); }
    .step-tab { flex: 1; display: flex; align-items: center; gap: 8px; padding: 12px 16px; font-size: .75rem; font-weight: 600; cursor: pointer; border-right: 1px solid var(--border); color: var(--card-text); background: transparent; border-top: none; border-bottom: none; border-left: none; }
    .step-tab:last-child { border-right: none; }
    .step-tab.active { background: rgba(239,68,68,.06); }
    .step-num { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; border-radius: var(--step-radius); flex-shrink: 0; }

    /* Card */
    .c { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--card-radius); padding: 20px; }
    .c h3 { font-size: .875rem; font-weight: 700; color: var(--card-title); }
    .c .desc { font-size: .75rem; margin-top: 2px; color: var(--card-desc); }

    .fg .err { font-size: .7rem; color: #EF4444; margin-top: 2px; }
    .fg-row { display: flex; gap: 8px; }
    .fg-row > .fg { flex: 1; }
    .phone-row { display: flex; gap: 8px; }
    .phone-prefix { display: flex; align-items: center; padding: 10px 12px; border: 1px solid var(--input-border); border-radius: var(--field-radius); font-size: .875rem; font-weight: 500; background: #F9FAFB; color: var(--card-desc); white-space: nowrap; }

    .sum-total .sv { color: var(--primary); }

    .rv .rl { font-size: .75rem; font-weight: 500; color: var(--card-label); }
    .rv .rval { font-size: .875rem; font-weight: 600; color: var(--card-title); }

    /* PIX / Step 3 */
    .pix-center { text-align: center; }
    .qr-wrap { display: flex; justify-content: center; margin: 12px 0; }
    .qr-wrap img { width: 208px; height: 208px; border-radius: 8px; }
    .qr-placeholder { width: 208px; height: 208px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #F3F4F6; }
    .copy-row { display: flex; gap: 8px; margin: 8px 0; }
    .copy-row input { flex: 1; padding: 8px 12px; border: 1px solid var(--input-border); border-radius: 8px; font-size: .75rem; background: #F9FAFB; color: var(--card-desc); }
    .copy-row button { padding: 8px 16px; border: none; border-radius: var(--btn-radius); background: var(--primary); color: #fff; font-size: .75rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 4px; white-space: nowrap; }

    /* How to pay */
    .how-step { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
    .how-num { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
    .how-text { font-size: .75rem; color: var(--card-desc); }

    /* Warning box */

    .benef strong { color: var(--card-title); }

    /* Upload */
    .upload-zone { border: 2px dashed var(--primary); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; background: rgba(239,68,68,.03); transition: opacity .2s; }
    .upload-zone:hover { opacity: .8; }
    .upload-zone input { display: none; }

    .upload-zone p { font-size: .75rem; color: var(--card-desc); text-align: center; }
    .upload-success { display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 12px; background: #F0FDF4; border: 1px solid #22C55E; }
    .upload-success p { font-size: .875rem; font-weight: 500; color: #16A34A; }

    /* Banks */
    .bank-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; transition: opacity .2s; margin-bottom: 8px; background: var(--card-bg); }
    .bank-item:hover { opacity: .8; }
    .bank-logo { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #fff; }
    .bank-info { flex: 1; }
    .bank-info p:first-child { font-size: .75rem; font-weight: 600; color: var(--card-title); }
    .bank-info p:last-child { font-size: .625rem; color: var(--card-desc); }
    .bank-toggle { width: 100%; text-align: center; font-size: .75rem; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--card-bg); color: var(--card-desc); cursor: pointer; }

    /* Guarantee */
    .guarantee { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: .75rem; padding: 8px 0; color: var(--card-desc); }
    /* Guarantee dashed box */
    .guarantee-box { border: 2px dashed var(--primary); border-radius: var(--card-radius); padding: 16px; text-align: center; background: rgba(239,68,68,.04); }

    .waiting span { font-size: .75rem; font-weight: 500; color: var(--card-desc); }

    /* Testimonial */
    .testimonial { border-radius: 12px; border: 1px solid #FED7AA; background: #FFF7ED; padding: 16px; }
    .testimonial .stars { display: flex; gap: 2px; margin-bottom: 4px; }
    .testimonial .t-name { font-size: .75rem; font-weight: 700; color: var(--card-title); }
    .testimonial .t-text { font-size: .75rem; color: var(--card-desc); margin-top: 2px; line-height: 1.5; }
    /* Confianca testimonial (inside card) */
    .testimonial-card { border: 1px solid var(--border); border-radius: var(--card-radius); background: var(--card-bg); padding: 16px; }

    /* FAQ */
    .faq-item { border-bottom: 1px solid var(--border); }
    .faq-item:last-child { border-bottom: none; }
    .faq-q { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 12px 0; background: none; border: none; cursor: pointer; text-align: left; font-size: .75rem; font-weight: 500; color: var(--card-text); }
    .faq-a { font-size: .75rem; color: var(--card-desc); padding-bottom: 12px; line-height: 1.5; }

    /* Collapsible section (TokLynx mobile) */
    .collapse-header { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 12px 16px; background: none; border: none; cursor: pointer; font-size: .6875rem; font-weight: 600; color: var(--card-title); }
    .collapse-content { padding: 0 16px 16px; }

    /* Banner (Confianca) */
    .banner-area { width: 100%; padding: 32px 24px; display: flex; align-items: center; justify-content: center; }

    /* Info badges */
    .info-badge { display: flex; align-items: flex-start; gap: 12px; }
    .info-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .info-badge .ib-title { font-size: .75rem; font-weight: 700; color: var(--card-title); }
    .info-badge .ib-desc { font-size: .6875rem; color: var(--card-desc); }

    /* Promo banner (Alto Impacto) */
    .promo-banner { border-radius: var(--card-radius); border: 1px solid var(--border); overflow: hidden; text-align: center; padding: 12px 20px; font-size: .75rem; font-weight: 600; color: #fff; }

    .hidden { display: none; }

    @media (max-width: 640px) {
      .co { padding: 16px 12px; gap: 12px; }
      .c { padding: 16px; }
    }
  </style>

  function getVideoEmbed(url) {
    if (!url) return '';
    var yt = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    if (yt) return 'https://www.youtube.com/embed/'+yt[1]+'?rel=0';
    if (url.indexOf('vturb.com')!==-1) {
      if (url.indexOf('/embed/')!==-1||url.indexOf('player.vturb')!==-1) return url;
      var vt = url.match(/vturb\.com(?:\.br)?\/(?:v|video)\/([a-zA-Z0-9]+)/);
      if (vt) return 'https://player.vturb.com.br/embed/'+vt[1];
      return url;
    }
    var vim = url.match(/vimeo\.com\/(\d+)/);
    if (vim) return 'https://player.vimeo.com/video/'+vim[1];
    return url;
  }

  function renderElementsAt(position) {
    var h = '';
    var filtered = elems.filter(function(el) { return el.position === position && el.visible; })
      .sort(function(a,b) { return (a.order||0)-(b.order||0); });
    if (!filtered.length) return '';
    filtered.forEach(function(el) { h += '<div style="margin-bottom:12px">'+renderElement(el)+'</div>'; });
    return '<div style="margin-top:8px">'+h+'</div>';
  }

  function bindElementEvents() {
    document.querySelectorAll('[data-faq-el]').forEach(function(btn) {
      btn.onclick = function() {
        var id = btn.getAttribute('data-faq-el');
        var ans = document.getElementById('faq-el-'+id);
        if (ans) ans.style.display = ans.style.display === 'none' ? '' : 'none';

  function startElementTimers() {
    // Countdown timers
    Object.keys(elCountdowns).forEach(function(id) {
      var ct = elCountdowns[id];
      if (ct.interval) return;
      var el2 = elems.find(function(e){return e.id===id});
      var ec = el2 && el2.content || {};
      ct.interval = setInterval(function() {
        if (ct.total <= 0) {
          if ((ec.timerType||'fixed')==='fixed') ct.total = (ec.minutes||10)*60;
          else return;
        }
        ct.total--;
        var cdEl = document.getElementById('cd-'+id);
        if (!cdEl) return;
        var h2 = Math.floor(ct.total/3600), m2 = Math.floor((ct.total%3600)/60), s2 = ct.total%60;
        var timeStr = String(h2).padStart(2,'0')+':'+String(m2).padStart(2,'0')+':'+String(s2).padStart(2,'0');
        // Banner style: update the .cd-time span
        var timeSpan = cdEl.querySelector('.cd-time');
        if (timeSpan) { timeSpan.textContent = timeStr; return; }
        // Cards style: update each .cd-unit
        var units = cdEl.querySelectorAll('.cd-unit');
        if (units.length===3) { units[0].textContent = String(h2).padStart(2,'0'); units[1].textContent = String(m2).padStart(2,'0'); units[2].textContent = String(s2).padStart(2,'0'); }
      }, 1000);
    });
    // Sales counters
    elems.filter(function(e){return e.type==='sales'&&e.visible}).forEach(function(el) {
      var c = el.content||{};
      if (!c.showAnimation) return;
      if (el._salesInterval) return;
      var intervalMs = c.interval||800;
      el._salesInterval = setInterval(function() {
        var max = c.maxValue||1000, min = c.minValue||0;
        var cur = elSalesCounts[el.id]||0;
        if (cur >= max) { elSalesCounts[el.id] = min; cur = min; }
        var inc = c.randomIncrement
          ? Math.floor(Math.random()*((c.incrementMax||5)-(c.incrementMin||1)+1))+(c.incrementMin||1)
          : (c.increment||1);
        elSalesCounts[el.id] = Math.min(cur+inc, max);
        var se = document.getElementById('sales-'+el.id);
        if (!se) return;
        var valSpan = se.querySelector('.sales-val');
        if (valSpan) {
          var fmt2 = c.format||'default', customFmt = c.customFormat||'{value} Compras';
          valSpan.textContent = fmt2==='custom' ? customFmt.replace('{value}',String(elSalesCounts[el.id])) : String(elSalesCounts[el.id]);
        }
      }, intervalMs);
    });
  }

  // Resolve which content to show based on step + totalSteps
  function stepContentHTML(templateStep1Fn) {
    var reviewStep = getReviewStep(), payStep = getPaymentStep(), addrStep = getAddressStep();
    if (step === 1) return templateStep1Fn();
    if (addrStep && step === addrStep) return stepAddressHTML();
    if (step === reviewStep) return step2HTML();
    if (step === payStep) return step3HTML();
    return '';

  function render() {

    var co = document.getElementById('co');
    if (!co) return;
    // Clean up previous footer wrapper
    var oldFooterWrap = document.getElementById('footer-wrap');
    if (oldFooterWrap) oldFooterWrap.remove();
    var tid = cfg.templateId;
    var use2Col = (tid === 'minimalista' || tid === 'alto-impacto' || tid === 'streamline' || tid === 'lynxfy' || tid === 'confianca');

    if (use2Col) {
      // 2-column layout
      var mainH = '';
      // Elements: top
      mainH += renderElementsAt('top');
      // Step indicators in main column
      if (tid === 'streamline') mainH += stepTabsHTML();
      else mainH += stepsHTML();

      // Elements: above-form
      mainH += renderElementsAt('above-form');

      var step1Fn = tid === 'minimalista' ? step1Minimalista
        : tid === 'alto-impacto' ? step1AltoImpacto
        : tid === 'streamline' ? step1Streamline
        : tid === 'lynxfy' ? step1LynxFy
        : tid === 'confianca' ? step1Confianca
        : step1Default;
      mainH += stepContentHTML(step1Fn);

      // Elements: below-form
      mainH += renderElementsAt('below-form');

      // Sidebar
      var sideH = '';
      if (tid === 'confianca') sideH += sidebarSummaryHTML({showQuantity:true,useQuantity:true,showCount:true});
      else if (tid === 'lynxfy') sideH += sidebarSummaryHTML({showQuantity:true,useQuantity:true,showCount:true});
      else sideH += sidebarSummaryHTML({showCount:true});

      // Order bump in sidebar
      if (cfg.showOrderBump) {
        sideH += '<div class="c" style="border:2px dashed var(--primary)">';
        sideH += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><input type="checkbox" style="width:16px;height:16px;accent-color:var(--primary)" /><span style="font-size:.75rem;font-weight:700;color:var(--primary)">🎁 OFERTA ESPECIAL!</span></div>';
        sideH += '<p style="font-size:.75rem;color:var(--card-desc)">'+(cfg.orderBumpText||'Adicione este produto por apenas')+' <strong style="color:var(--primary)">'+fmt(cfg.orderBumpPrice)+'</strong></p>';
        sideH += '</div>';
      }


      // Elements: sidebar
      sideH += renderElementsAt('sidebar');
      // Elements: sidebar-bottom
      sideH += renderElementsAt('sidebar-bottom');

      co.innerHTML = '<div class="col-main">'+mainH+'</div><div class="col-side">'+sideH+'</div>';
      co.className = 'layout-2col';
    } else if (tid === 'tiktok') {
      // TokLynx: 2-col on desktop, single on mobile
      var mainH2 = renderElementsAt('top');
      mainH2 += stepsHTML();
      mainH2 += renderElementsAt('above-form');
      mainH2 += stepContentHTML(step1TokLynx);
      mainH2 += renderElementsAt('below-form');

      var sideH2 = sidebarSummaryHTML({showCount:true});
      sideH2 += renderElementsAt('sidebar');
      sideH2 += renderElementsAt('sidebar-bottom');

      co.innerHTML = '<div class="col-main">'+mainH2+'</div><div class="col-side">'+sideH2+'</div>';
      co.className = 'layout-2col';
    } else {
      // Default single-column
      var h = renderElementsAt('top');
      h += stepsHTML();
      // Summary (always visible)
      h += defaultSummaryHTML();
      h += renderElementsAt('above-form');
      h += stepContentHTML(step1Default);
      h += renderElementsAt('below-form');
      h += footerHTML();
      h += renderElementsAt('footer');
      co.innerHTML = h;
      co.className = 'co';
    }

    // Footer for all layouts (below the columns)
    if (use2Col || tid === 'tiktok') {
      var footerWrap = document.createElement('div');
      footerWrap.id = 'footer-wrap';
      footerWrap.style.maxWidth = '56rem';
      footerWrap.style.margin = '0 auto';
      footerWrap.style.padding = '0 16px';
      footerWrap.innerHTML = footerHTML() + renderElementsAt('footer');
      co.parentNode.insertBefore(footerWrap, co.nextSibling);
    }

    bind();
    bindElementEvents();
    startElementTimers();
  }

  function bind() {
    var b1 = document.getElementById('btn-s1');
    if (b1) b1.onclick = function() {
      var n=document.getElementById('f-name'), e=document.getElementById('f-email'), c=document.getElementById('f-cpf'), p=document.getElementById('f-phone');
      fd.name = n?n.value:''; fd.email = e?e.value:''; fd.cpf = c?c.value:''; fd.phone = p?p.value:'';
      collectAddressFields();
      var err=document.getElementById('cpf-err');
      if (!fd.cpf.trim()) { if(err) err.textContent='CPF/CNPJ é obrigatório'; return; }
      if (!validateCpfCnpj(fd.cpf)) { if(err) err.textContent='CPF ou CNPJ inválido'; if(c) c.style.borderColor='#EF4444'; return; }
      if(c) c.style.borderColor='';
      // If 4 steps, go to address; else go to review
      step = totalSteps === 4 ? 2 : 2; render();
    };
    var cpfInput = document.getElementById('f-cpf');
    if (cpfInput) {
      cpfInput.setAttribute('maxlength','18');
      cpfInput.oninput = function() {
        cpfInput.value = formatCpfCnpj(cpfInput.value);
        var err=document.getElementById('cpf-err'); if(err) err.textContent='';
        cpfInput.style.borderColor='';
      };
    }
    // Address step buttons (4-step only)
    var addrNext = document.getElementById('btn-addr-next');
    if (addrNext) addrNext.onclick = function() { collectAddressFields(); step = getReviewStep(); render(); };
    var addrBack = document.getElementById('btn-addr-back');
    if (addrBack) addrBack.onclick = function() { step = 1; render(); };
    var b2 = document.getElementById('btn-s2');
    if (b2) b2.onclick = function() { step = getPaymentStep(); render(); if (!pixData) genPix(); };
    var bb = document.getElementById('btn-back');
    if (bb) bb.onclick = function() { step = totalSteps === 4 ? getAddressStep() : 1; render(); };
    var bc = document.getElementById('btn-copy');
    if (bc) bc.onclick = function() {
      var ci = document.getElementById('pix-code');
      if (ci) { navigator.clipboard.writeText(ci.value); bc.innerHTML = '✓ Copiado!'; setTimeout(function(){ bc.innerHTML = I.copy+' Copiar'; }, 2000); }
    };
    var uz = document.getElementById('upload-zone'), ri = document.getElementById('receipt-input');
    if (uz && ri) { uz.onclick = function() { ri.click(); }; ri.onchange = function() { if(ri.files&&ri.files[0]) uploadReceipt(ri.files[0]); }; }
    var bt = document.getElementById('btn-banks');
    if (bt) bt.onclick = function() { showAllBanks = !showAllBanks; render(); };
    document.querySelectorAll('.bank-item').forEach(function(el) {
      el.onclick = function() { if (pixData && pixData.brCode) navigator.clipboard.writeText(pixData.brCode); };
    });
    // FAQ (Confianca)
    document.querySelectorAll('.faq-q').forEach(function(el) {
      el.onclick = function() {
        var idx = parseInt(el.getAttribute('data-faq'));
        openFaq = openFaq === idx ? -1 : idx;
        render();
      };
    });
  }

  window.goStep = function(n) { if (n <= step) { step = n; render(); } };
  window.changeQty = function(d) { quantity = Math.max(1, quantity + d); render(); };

  async function genPix() {
    try {
      var r = await fetch(SB+'/functions/v1/create-pix-charge', {
        method:'POST', headers:{apikey:AK,'Content-Type':'application/json'},
        body: JSON.stringify({ slug:getSlug(), amount:pixPrice(), customerName:fd.name, customerEmail:fd.email, customerPhone:fd.phone, customerCpf:fd.cpf })
      });
      var d = await r.json();
      if (!r.ok) {
        var detailedMessage = d && (d.message || d.error) ? (d.message || d.error) : 'Erro';
        var suffix = d && d.attempt ? ' (tentativa: ' + d.attempt + ')' : '';
        throw new Error(detailedMessage + suffix);
      }
      pixData = d;
      render();
      startPaymentPolling();
    } catch(e) {
      var ps = document.getElementById('pix-status');
      if (ps) ps.innerHTML = '<p style="color:#EF4444;font-size:.85rem">Erro: '+e.message+'</p>';
    }
  }

  var paymentPollInterval = null;
  function startPaymentPolling() {
    if (paymentPollInterval) clearInterval(paymentPollInterval);
    if (!pixData || !pixData.correlationID) return;
    var attempts = 0;
    paymentPollInterval = setInterval(async function() {
      attempts++;
      if (attempts > 240) { clearInterval(paymentPollInterval); return; } // ~20min @5s
      try {
        var r = await fetch(SB+'/functions/v1/check-payment-status?external_id='+encodeURIComponent(pixData.correlationID),{headers:{apikey:AK}});
        if (!r.ok) return;
        var d = await r.json();
        if (d.status === 'approved') {
          clearInterval(paymentPollInterval);
          showPaymentApproved();
        }
      } catch(e) {}
    }, 5000);
  }

  function showPaymentApproved() {
    app.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px"><div style="max-width:420px;text-align:center;background:var(--card-bg,#fff);border-radius:12px;padding:32px;box-shadow:0 4px 24px rgba(0,0,0,.08)"><div style="width:64px;height:64px;border-radius:50%;background:#10B981;display:flex;align-items:center;justify-content:center;margin:0 auto 16px"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div><h2 style="font-size:1.5rem;font-weight:700;margin-bottom:8px">Pagamento aprovado!</h2><p style="color:#6B7280;font-size:.95rem">Seu pedido foi confirmado com sucesso.</p></div></div>';
  }

  async function uploadReceipt(file) {
    if (!pixData||!pixData.correlationID) return;
    var uz = document.getElementById('upload-zone');
    if (uz) uz.innerHTML = '<div class="spinner"></div><p style="font-size:.8rem;color:var(--card-desc);margin-top:8px">Enviando...</p>';
    try {
      var f = new FormData(); f.append('file',file); f.append('correlationID',pixData.correlationID);
      var r = await fetch(SB+'/functions/v1/upload-receipt',{method:'POST',headers:{apikey:AK},body:f});
      var d = await r.json(); if (!r.ok) throw new Error(d.error||'Erro');
      receiptUploaded = true; render();
    } catch(e) { if(uz) uz.innerHTML = '<p style="color:#EF4444">Erro: '+e.message+'</p>'; }
  }

  function startTimer(min) {
    timerSec = min * 60; countM = min; countS = 0;
    setInterval(function() {
      if (timerSec <= 0) return;
      timerSec--;
      countM = Math.floor(timerSec/60);
      countS = timerSec % 60;
      var el = document.getElementById('timer-val');
      if (el) el.textContent = '00h : '+String(countM).padStart(2,'0')+'m : '+String(countS).padStart(2,'0')+'s';
    }, 1000);
  }

    }
    if (cfg.templateId === 'streamline' && cfg.showTimer) {
      shell += '<div class="timer-banner" style="display:flex;align-items:center;justify-content:center;gap:8px">Oferta termina em: <span style="font-weight:700;background:rgba(255,255,255,.2);padding:2px 12px;border-radius:9999px;font-size:.75rem" id="timer-val">00h : '+String(cfg.timerMinutes).padStart(2,'0')+'m : 00s</span></div>';
    }
    shell += '<div id="co"></div>';
    app.innerHTML = shell;

    // Confianca step indicators (rendered separately)
    if (cfg.templateId === 'confianca') {
      var csEl = document.getElementById('confianca-steps');
      if (csEl) {
        var renderConfiancaSteps = function() {
          var labels = getStepLabels();
          var sh = '<div style="display:flex;align-items:center;justify-content:center;gap:40px;padding:12px;max-width:700px;margin:0 auto">';
          labels.forEach(function(s) {
            var active = step===s.n, done = step > s.n;
            var bg = active ? 'rgba(239,68,68,.12)' : done ? 'rgba(239,68,68,.12)' : '#F3F4F6';
            var border = active ? '2px solid var(--step-bg)' : done ? '2px solid rgba(239,68,68,.5)' : '2px solid transparent';
            sh += '<button onclick="goStep('+s.n+')" style="display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;cursor:pointer">';
            sh += '<div style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:var(--step-radius);background:'+bg+';border:'+border+'">';
            sh += '<span style="color:'+(step>=s.n?'var(--step-bg)':'var(--card-label)')+'">'+(done?I.checkSm:I[s.i])+'</span>';
            sh += '</div>';
            sh += '<span style="font-size:10px;font-weight:600;color:'+(active?'var(--step-bg)':'var(--card-label)')+'">'+s.l+'</span>';
            sh += '</button>';
          });
          sh += '</div>';
          csEl.innerHTML = sh;
        };
        renderConfiancaSteps();
        // Re-render on step change
        var origRender = render;
        render = function() { origRender(); renderConfiancaSteps(); };
      }
    }

    if (cfg.showTimer) startTimer(cfg.timerMinutes||15);
    if (!cfg.pageTitle) document.title = cfg.productName || 'Checkout';
    render();

    // ── Presence tracking (mirror useCheckoutPresence) ──
    try {
      var ownerUserId = co.user_id;
      if (ownerUserId && slug && window.supabase) {
        var sbClient = window.supabase.createClient(SB, AK);
        var presenceChannelName = 'gateway-active-checkouts:' + ownerUserId;
        var sessionKey = 'gateway-checkout-session:' + slug;
        var sessionId = sessionStorage.getItem(sessionKey);
        if (!sessionId) {
          sessionId = (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2);
          sessionStorage.setItem(sessionKey, sessionId);
        }
        var joinedAt = new Date().toISOString();
        var productLabel = cfg.productName || slug || '';

        var presenceChannel = sbClient.channel(presenceChannelName, {
          config: { presence: { key: sessionId } }
        });

        var trackPayload = {
          kind: 'checkout',
          sessionId: sessionId,
          checkoutSlug: slug,
          ownerUserId: ownerUserId,
          joinedAt: joinedAt,
          productName: productLabel
        };

        try {
          var coordinates = await getCoordinatesByIP();
          if (typeof coordinates.latitude === 'number') trackPayload.latitude = coordinates.latitude;
          if (typeof coordinates.longitude === 'number') trackPayload.longitude = coordinates.longitude;
        } catch(ge) {}

        presenceChannel.subscribe(function(status) {
          if (status !== 'SUBSCRIBED') return;
          presenceChannel.track(trackPayload);
        });

        // Re-track on visibility change
        document.addEventListener('visibilitychange', function() {
          if (document.visibilityState === 'visible') presenceChannel.track(trackPayload);
        });
        window.addEventListener('focus', function() { presenceChannel.track(trackPayload); });
        window.addEventListener('beforeunload', function() { presenceChannel.untrack(); });
        window.addEventListener('pagehide', function() { presenceChannel.untrack(); });
      }
    } catch(e) { console.warn('Presence tracking error:', e); }
  }

  init();
})();
</script>
</body>
</html>
