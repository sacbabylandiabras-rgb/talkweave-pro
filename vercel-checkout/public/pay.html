<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #EF4444; --primary-fg: #fff; --bg: #EFF1F5; --card-bg: #fff;
      --text: #1F2937; --text-muted: #6B7280; --border: #E5E7EB;
      --card-radius: 16px; --btn-radius: 8px; --field-radius: 8px; --step-radius: 9999px;
      --input-bg: #fff; --input-border: #D1D5DB;
      --card-title: #111827; --card-desc: #6B7280; --card-label: #6B7280; --card-text: #1F2937;
      --step-bg: #EF4444; --step-text: #fff; --btn-color: #EF4444;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
    .loader-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
    .error-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; }
    .error-wrap h2 { font-size: 1.15rem; font-weight: 600; }
    .error-wrap p { font-size: .85rem; color: var(--text-muted); }

    /* Timer Banner */
    .timer-banner { width: 100%; text-align: center; padding: 12px; font-size: .875rem; font-weight: 500; background: var(--primary); color: #fff; }
    .timer-banner b { margin-left: 4px; }

    /* Logo Header */
    .logo-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--card-bg); border-bottom: 1px solid var(--border); }
    .logo-header img { height: 32px; width: auto; object-fit: contain; }
    .logo-header .safe { display: flex; align-items: center; gap: 4px; font-size: .7rem; font-weight: 500; color: #16A34A; }

    /* Container */
    .co { max-width: 32rem; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 16px; }

    /* Steps */
    .steps { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 0; }
    .step-item { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
    .step-c { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: var(--step-radius); transition: all .3s; }
    .step-l { font-size: 10px; font-weight: 600; }
    .step-sep { width: 32px; height: 2px; border-radius: 1px; margin-bottom: 20px; }

    /* Card */
    .c { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--card-radius); padding: 20px; }
    .c h3 { font-size: .875rem; font-weight: 700; color: var(--card-title); }
    .c .desc { font-size: .75rem; margin-top: 2px; color: var(--card-desc); }

    /* Form */
    .fg { margin-bottom: 12px; }
    .fg label { display: block; font-size: .75rem; font-weight: 500; color: var(--card-label); margin-bottom: 4px; }
    .fg input { width: 100%; padding: 10px 12px; border: 1px solid var(--input-border); border-radius: var(--field-radius); font-size: .875rem; outline: none; background: var(--input-bg); color: var(--card-text); transition: border-color .2s; }
    .fg input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(239,68,68,.08); }
    .fg .err { font-size: .7rem; color: #EF4444; margin-top: 2px; }
    .fg-row { display: flex; gap: 8px; }
    .fg-row > .fg { flex: 1; }
    .phone-row { display: flex; gap: 8px; }
    .phone-prefix { display: flex; align-items: center; padding: 10px 12px; border: 1px solid var(--input-border); border-radius: var(--field-radius); font-size: .875rem; font-weight: 500; background: #F9FAFB; color: var(--card-desc); white-space: nowrap; }

    /* Buttons */
    .btn { width: 100%; padding: 16px; border: none; border-radius: var(--btn-radius); background: var(--btn-color); color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; transition: transform .1s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn:hover { transform: scale(1.02); }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .btn-outline { background: var(--card-bg); color: var(--card-title); border: 1px solid var(--border); }
    .btn-outline:hover { transform: none; opacity: .8; }
    .btn-row { display: flex; gap: 12px; }
    .btn-row .btn { flex: 1; }
    .btn-row .btn:last-child { flex: 2; }

    /* Summary */
    .sum-sep { border-top: 1px solid var(--border); padding-top: 8px; margin-top: 8px; }
    .sum-row { display: flex; justify-content: space-between; font-size: .875rem; padding: 2px 0; }
    .sum-row .sl { color: var(--card-desc); }
    .sum-row .sv { font-weight: 500; color: var(--card-title); }
    .sum-total { display: flex; justify-content: space-between; font-size: 1rem; font-weight: 700; padding-top: 8px; border-top: 1px solid var(--border); margin-top: 4px; }
    .sum-total .sv { color: var(--primary); }

    /* Review rows */
    .rv { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .rv:last-child { border-bottom: none; }
    .rv .rl { font-size: .75rem; font-weight: 500; color: var(--card-label); }
    .rv .rval { font-size: .875rem; font-weight: 600; color: var(--card-title); }

    /* PIX / Step 3 */
    .pix-center { text-align: center; }
    .qr-wrap { display: flex; justify-content: center; margin: 12px 0; }
    .qr-wrap img { width: 208px; height: 208px; border-radius: 8px; }
    .qr-placeholder { width: 208px; height: 208px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #F3F4F6; }
    .copy-row { display: flex; gap: 8px; margin: 8px 0; }
    .copy-row input { flex: 1; padding: 8px 12px; border: 1px solid var(--input-border); border-radius: 8px; font-size: .75rem; background: #F9FAFB; color: var(--card-desc); }
    .copy-row button { padding: 8px 16px; border: none; border-radius: var(--btn-radius); background: var(--primary); color: #fff; font-size: .75rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 4px; white-space: nowrap; }

    /* How to pay */
    .how-step { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
    .how-num { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
    .how-text { font-size: .75rem; color: var(--card-desc); }

    /* Warning box */
    .warn { display: flex; align-items: flex-start; gap: 8px; padding: 12px; border-radius: var(--card-radius); border: 1px solid #FCD34D; background: #FFFBEB; }
    .warn p { font-size: .75rem; color: #92400E; }
    .warn svg { flex-shrink: 0; margin-top: 2px; }

    /* Beneficiary */
    .benef { font-size: .75rem; color: var(--card-desc); display: flex; align-items: flex-start; gap: 4px; }
    .benef strong { color: var(--card-title); }

    /* Upload */
    .upload-zone { border: 2px dashed var(--primary); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; background: rgba(239,68,68,.03); transition: opacity .2s; }
    .upload-zone:hover { opacity: .8; }
    .upload-zone input { display: none; }
    .upload-zone .uz-icon { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(239,68,68,.1); }
    .upload-zone p { font-size: .75rem; color: var(--card-desc); text-align: center; }
    .upload-success { display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 12px; background: #F0FDF4; border: 1px solid #22C55E; }
    .upload-success p { font-size: .875rem; font-weight: 500; color: #16A34A; }

    /* Banks */
    .bank-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; transition: opacity .2s; margin-bottom: 8px; background: var(--card-bg); }
    .bank-item:hover { opacity: .8; }
    .bank-logo { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #fff; }
    .bank-logo div { width: 100%; height: 100%; border-radius: 6px; }
    .bank-info { flex: 1; }
    .bank-info p:first-child { font-size: .75rem; font-weight: 600; color: var(--card-title); }
    .bank-info p:last-child { font-size: .625rem; color: var(--card-desc); }
    .bank-toggle { width: 100%; text-align: center; font-size: .75rem; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--card-bg); color: var(--card-desc); cursor: pointer; }

    /* Guarantee */
    .guarantee { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: .75rem; padding: 8px 0; color: var(--card-desc); }

    /* Waiting */
    .waiting { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 0; }
    .waiting span { font-size: .75rem; font-weight: 500; color: var(--card-desc); }

    /* Footer */
    .foot { text-align: center; padding: 16px; font-size: .7rem; color: var(--card-desc); display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .foot-badges { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .foot-badges img { height: 20px; }

    .hidden { display: none; }

    @media (max-width: 640px) {
      .co { padding: 16px 12px; gap: 12px; }
      .c { padding: 16px; }
    }
  </style>

  <link id="font-link" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>

    // Totals
    h += '<div class="sum-sep">';
    h += '<div class="sum-row"><span class="sl">Subtotal</span><span class="sv">'+fmt(cfg.price)+'</span></div>';
    h += '<div class="sum-row"><span class="sl">Frete</span><span class="sv" style="color:#16A34A">Grátis</span></div>';
    h += '<div class="sum-total"><span style="color:var(--card-title)">Total</span><span class="sv">'+fmt(cfg.price)+'</span></div>';
    h += '</div></div>';
    return h;
  }

  // Step 1
  function step1HTML() {
    var h = '<div class="c">';
    h += '<h3>Dados pessoais</h3><p class="desc">Informe seus dados para concluir sua compra com segurança.</p>';
    h += '<div style="margin-top:16px">';
    h += '<div class="fg"><label>Nome completo</label><input id="f-name" placeholder="Digite seu nome completo" value="'+fd.name+'" /></div>';
    h += '<div class="fg"><label>E-mail</label><input id="f-email" type="email" placeholder="seu@email.com" value="'+fd.email+'" /></div>';
    h += '<div class="fg"><label>CPF ou CNPJ <span style="color:#EF4444">*</span></label><input id="f-cpf" placeholder="000.000.000-00" value="'+fd.cpf+'" /><div class="err" id="cpf-err"></div></div>';
    if (cfg.showPhone !== false) {
      h += '<div class="fg"><label>Celular (WhatsApp)</label>';
      h += '<div class="phone-row"><div class="phone-prefix">🇧🇷 +55</div>';
      h += '<input id="f-phone" placeholder="(00) 00000-0000" value="'+fd.phone+'" style="flex:1" /></div></div>';
    }
    h += '</div></div>';
    // Order bump
    if (cfg.showOrderBump) {
      h += '<div class="c" style="border:2px dashed var(--primary)">';
      h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><input type="checkbox" style="width:16px;height:16px;accent-color:var(--primary)" /><span style="font-size:.75rem;font-weight:700;color:var(--primary)">🎁 OFERTA ESPECIAL!</span></div>';
      h += '<p style="font-size:.75rem;color:var(--card-desc)">'+(cfg.orderBumpText||'Adicione este produto por apenas')+' <strong style="color:var(--primary)">'+fmt(cfg.orderBumpPrice)+'</strong></p>';
      h += '</div>';
    }
    // Button
    h += '<button class="btn" id="btn-s1">'+I.lock+' Continuar</button>';
    return h;
  }

  // Step 2
  function step2HTML() {
    var h = '<div class="c">';
    h += '<h3>Confira seus dados</h3><p class="desc">Verifique se as informações estão corretas antes de prosseguir.</p>';
    h += '<div style="margin-top:16px">';
    h += '<div class="rv"><span class="rl">Nome</span><span class="rval">'+(fd.name||'—')+'</span></div>';
    h += '<div class="rv"><span class="rl">E-mail</span><span class="rval">'+(fd.email||'—')+'</span></div>';
    h += '<div class="rv"><span class="rl">CPF / CNPJ</span><span class="rval">'+(fd.cpf||'—')+'</span></div>';
    if (cfg.showPhone !== false && fd.phone) h += '<div class="rv"><span class="rl">Celular</span><span class="rval">'+fd.phone+'</span></div>';
    h += '<div class="rv"><span class="rl">Valor total</span><span class="rval" style="font-size:1rem;font-weight:700;color:var(--primary)">'+fmt(cfg.price)+'</span></div>';
    h += '</div></div>';
    h += '<div class="btn-row">';
    h += '<button class="btn btn-outline" id="btn-back">Voltar</button>';
    h += '<button class="btn" id="btn-s2">'+I.lock+' Confirmar e Pagar</button>';
    h += '</div>';
    return h;
  }

  // Step 3
  function step3HTML() {
    var pp = pixPrice();
    var tStr = '00h : '+String(countM).padStart(2,'0')+'m : '+String(countS).padStart(2,'0')+'s';
    var h = '';
    // "Já é quase seu..."
    h += '<div class="c">';
    h += '<h3 style="font-size:1.125rem">Já é quase seu...</h3>';
    h += '<p style="font-size:.875rem;color:var(--card-desc);margin-top:8px">Pague seu pix dentro de <span style="font-weight:700;color:var(--primary)">'+tStr+'</span> para garantir sua compra</p>';
    h += '<div style="display:flex;justify-content:space-between;align-items:center;padding-top:8px;margin-top:8px;border-top:1px solid var(--border)">';
    h += '<span style="font-size:.875rem;font-weight:500;color:var(--card-desc)">Valor do pedido</span>';
    h += '<span style="font-size:1.25rem;font-weight:700;color:var(--card-title)">'+fmt(pp)+'</span>';
    h += '</div></div>';

    // Beneficiary
    h += '<div class="c" style="padding:16px"><p class="benef">'+I.shieldSm+' O beneficiário do Pix é o <strong>INTERMEDIADOR (AKASEG)</strong>, a empresa que gerencia nossos pagamentos de forma segura.</p></div>';

    // QR Code
    h += '<div class="c">';
    if (pixData) {
      h += '<p style="font-size:.75rem;font-weight:500;color:var(--card-label);text-align:center">'+I.phone+' aponte a câmera do seu celular</p>';
      h += '<div class="qr-wrap"><img src="'+pixData.qrCodeImage+'" alt="QR Code PIX" /></div>';
      h += '<div style="margin-top:8px"><p style="font-size:.75rem;font-weight:500;color:var(--card-label);margin-bottom:4px">Código Pix</p>';
      h += '<div class="copy-row"><input readonly value="'+pixData.brCode+'" id="pix-code" />';
      h += '<button id="btn-copy" style="border-radius:var(--btn-radius)">'+I.copy+' Copiar</button></div></div>';
    } else {
      h += '<p style="font-size:.75rem;font-weight:500;color:var(--card-label);text-align:center">'+I.phone+' aponte a câmera do seu celular</p>';
      h += '<div class="qr-wrap"><div class="qr-placeholder" style="color:var(--card-desc)">'+I.qr+'</div></div>';
      h += '<div id="pix-status" style="text-align:center;padding:8px"><div class="spinner" style="margin:0 auto"></div><p style="font-size:.75rem;color:var(--card-desc);margin-top:8px">Gerando QR Code PIX...</p></div>';
    }
    h += '</div>';

    // How to pay
    h += '<div class="c"><h3 style="font-size:.875rem">como pagar o pix</h3><div style="margin-top:12px">';
    var steps = ['abra o app do seu banco','acesse a opção "Copia e Cola"','insira o código copiado e finalize seu pagamento'];
    steps.forEach(function(t,i) {
      h += '<div class="how-step"><div class="how-num" style="background:rgba(239,68,68,.08);color:var(--primary)">'+(i+1)+'</div><p class="how-text">'+t+'</p></div>';
    });
    h += '</div></div>';

    // Warning
    h += '<div class="warn">'+I.warn+'<p>Os bancos reforçaram a segurança do Pix e podem exibir alertas preventivos durante o pagamento. Fique tranquilo — sua transação é segura e está totalmente protegida.</p></div>';

    // Upload receipt
    h += '<div class="c">';
    h += '<h3 style="color:var(--primary);display:flex;align-items:center;gap:8px">'+I.file+' enviar comprovante</h3>';
    h += '<p style="font-size:.75rem;color:var(--card-desc);margin-top:4px">(opcional) Se necessário, envie o comprovante para agilizar a confirmação do seu pagamento.</p>';
    if (receiptUploaded) {
      h += '<div class="upload-success" style="margin-top:12px">'+I.check+'<p>Comprovante enviado com sucesso!</p></div>';
    } else {
      h += '<div class="upload-zone" id="upload-zone" style="margin-top:12px"><input type="file" id="receipt-input" accept="image/*,.pdf" />';
      h += '<div class="uz-icon">'+I.file+'</div>';
      h += '<p>Arraste o comprovante aqui ou clique para selecionar</p>';
      h += '<p style="font-size:.625rem">Formatos: JPG, PNG, WebP, PDF (Até 7MB)</p>';
      h += '</div>';
    }
    h += '</div>';

    // Banks
    h += '<div class="c"><h3 style="font-size:.875rem">pague com seu banco</h3><p style="font-size:.75rem;color:var(--card-desc);margin-top:4px">Clique no seu banco para abrir o app e pagar:</p>';
    h += '<div style="margin-top:12px" id="banks-list">';
    var shown = showAllBanks ? BANKS : BANKS.slice(0,5);
    shown.forEach(function(b) {
      h += '<div class="bank-item" data-bank="'+b.n+'"><div class="bank-logo"><img src="'+b.logo+'" alt="'+b.n+'" style="width:100%;height:100%;object-fit:contain;border-radius:6px"></div>';
      h += '<div class="bank-info"><p>'+b.n+'</p><p>'+b.d+'</p></div>';
      h += '<span style="color:var(--primary)">'+I.phone+'</span></div>';
    });
    h += '</div>';
    h += '<button class="bank-toggle" id="btn-banks">'+(showAllBanks ? '▲ Ver menos' : '▼ Ver todos os bancos')+'</button>';
    h += '</div>';

    // Waiting
    h += '<div class="waiting"><div class="spinner" style="width:16px;height:16px;border-width:2px"></div><span>aguardando pagamento...</span></div>';

    return h;
  }

  function render() {
    var co = document.getElementById('co');
    if (!co) return;
    var h = stepsHTML() + summaryHTML();
    if (step===1) h += step1HTML();
    else if (step===2) h += step2HTML();
    else if (step===3) h += step3HTML();
    // Guarantee
    if (cfg.showGuarantee !== false) {
      h += '<div class="guarantee">'+I.shieldSm+' Garantia de '+(cfg.guaranteeDays||7)+' dias — Satisfação ou dinheiro de volta</div>';
    }
    // Footer
   h += '<div style="padding:16px 0;text-align:center">';
   h += '<p style="font-size:10px;color:#9CA3AF;font-weight:500;margin-bottom:8px">Formas de Pagamento</p>';
   h += '<div style="display:flex;align-items:center;justify-content:center;gap:8px">';
   h += '<img src="/banks/pix.png" alt="Pix" style="height:18px;object-fit:contain">';
   h += '<img src="/banks/mastercard.png" alt="Mastercard" style="height:17px;object-fit:contain">';
   h += '<img src="/banks/visa.png" alt="Visa" style="height:17px;object-fit:contain">';
   h += '<img src="/banks/elo.jpg" alt="Elo" style="height:17px;object-fit:contain">';
   h += '<img src="/banks/amex.png" alt="Amex" style="height:17px;object-fit:contain;border-radius:3px">';
   h += '</div>';
   h += '<p style="font-size:10px;color:#9CA3AF;margin-top:8px">Pagamento processado com segurança por ZapLynxPay</p>';
   h += '</div>';
    co.innerHTML = h;
    bind();
  }

  function bind() {
    var b1 = document.getElementById('btn-s1');
    if (b1) b1.onclick = function() {
      var n=document.getElementById('f-name'), e=document.getElementById('f-email'), c=document.getElementById('f-cpf'), p=document.getElementById('f-phone');
      fd.name = n?n.value:''; fd.email = e?e.value:''; fd.cpf = c?c.value:''; fd.phone = p?p.value:'';
      if (!fd.cpf.trim()) { var err=document.getElementById('cpf-err'); if(err) err.textContent='CPF/CNPJ é obrigatório'; return; }
      step = 2; render();
    };
    var b2 = document.getElementById('btn-s2');
    if (b2) b2.onclick = function() { step = 3; render(); if (!pixData) genPix(); };
    var bb = document.getElementById('btn-back');
    if (bb) bb.onclick = function() { step = 1; render(); };
    var bc = document.getElementById('btn-copy');
    if (bc) bc.onclick = function() {
      var ci = document.getElementById('pix-code');
      if (ci) { navigator.clipboard.writeText(ci.value); bc.innerHTML = '✓ Copiado!'; setTimeout(function(){ bc.innerHTML = I.copy+' Copiar'; }, 2000); }
    };
    var uz = document.getElementById('upload-zone'), ri = document.getElementById('receipt-input');
    if (uz && ri) { uz.onclick = function() { ri.click(); }; ri.onchange = function() { if(ri.files&&ri.files[0]) uploadReceipt(ri.files[0]); }; }
    var bt = document.getElementById('btn-banks');
    if (bt) bt.onclick = function() { showAllBanks = !showAllBanks; render(); };
    // Bank items - copy pix code
    document.querySelectorAll('.bank-item').forEach(function(el) {
      el.onclick = function() { if (pixData && pixData.brCode) navigator.clipboard.writeText(pixData.brCode); };
    });
  }

  window.goStep = function(n) { if (n < step) { step = n; render(); } };

  async function genPix() {
    try {
      var r = await fetch(SB+'/functions/v1/create-pix-charge', {
        method:'POST', headers:{apikey:AK,'Content-Type':'application/json'},
        body: JSON.stringify({ slug:getSlug(), amount:pixPrice(), customerName:fd.name, customerEmail:fd.email, customerPhone:fd.phone, customerCpf:fd.cpf })
      });
      var d = await r.json();
      if (!r.ok) throw new Error(d.error||'Erro');
      pixData = d;
      render();
    } catch(e) {
      var ps = document.getElementById('pix-status');
      if (ps) ps.innerHTML = '<p style="color:#EF4444;font-size:.85rem">Erro: '+e.message+'</p>';
    }
  }

  async function uploadReceipt(file) {
    if (!pixData||!pixData.correlationID) return;
    var uz = document.getElementById('upload-zone');
    if (uz) uz.innerHTML = '<div class="spinner"></div><p style="font-size:.8rem;color:var(--card-desc);margin-top:8px">Enviando...</p>';
    try {
      var f = new FormData(); f.append('file',file); f.append('correlationID',pixData.correlationID);
      var r = await fetch(SB+'/functions/v1/upload-receipt',{method:'POST',headers:{apikey:AK},body:f});
      var d = await r.json(); if (!r.ok) throw new Error(d.error||'Erro');
      receiptUploaded = true; render();
    } catch(e) { if(uz) uz.innerHTML = '<p style="color:#EF4444">Erro: '+e.message+'</p>'; }
  }

  function startTimer(min) {
    timerSec = min * 60; countM = min; countS = 0;
    setInterval(function() {
      if (timerSec <= 0) return;
      timerSec--;
      countM = Math.floor(timerSec/60);
      countS = timerSec % 60;
      var el = document.getElementById('timer-val');
      if (el) el.textContent = '00h : '+String(countM).padStart(2,'0')+'m : '+String(countS).padStart(2,'0')+'s';
    }, 1000);
  }

  async function init() {
    var slug = getSlug();
    if (!slug) { app.innerHTML = '<div class="error-wrap"><h2>Link inválido ou expirado.</h2><p>Verifique o link e tente novamente.</p></div>'; return; }
    var tid = getTenant();
    var results = await Promise.all([
      tid ? fetch(SB+'/functions/v1/get-tenant?subdomain='+encodeURIComponent(tid),{headers:{apikey:AK}}).then(function(r){return r.ok?r.json():null}).catch(function(){return null}) : Promise.resolve(null),
      fetch(SB+'/functions/v1/get-checkout?slug='+encodeURIComponent(slug),{headers:{apikey:AK}}).then(function(r){return r.ok?r.json():null})
    ]);
    tenant = results[0] ? results[0].tenant : null;
    var cr = results[1];
    if (!cr||!cr.checkout) { app.innerHTML = '<div class="error-wrap"><h2>Checkout não encontrado.</h2><p>Este checkout pode estar inativo.</p></div>'; return; }
    var co = cr.checkout, pr = cr.product, sv = co.config||{};
    cfg = {
      productName: sv.productName||(pr&&pr.name)||co.name||'',
      offerName: sv.offerName||(pr&&pr.name)||'',
      price: sv.price||(pr&&pr.price)||0,
      originalPrice: sv.originalPrice||0,
      buttonText: sv.buttonText||'Pagar Agora',
      guaranteeDays: sv.guaranteeDays||7,
      showGuarantee: sv.showGuarantee!==false,
      showTimer: sv.showTimer||false,
      timerMinutes: sv.timerMinutes||15,
      showSecurityBadges: sv.showSecurityBadges!==false,
      pix: sv.pix!==false, creditCard: sv.creditCard||false, boleto: sv.boleto||false,
      pixDiscount: sv.pixDiscount||0, maxInstallments: sv.maxInstallments||12,
      showCpf: sv.showCpf!==false, showPhone: sv.showPhone!==false,
      showAddress: sv.showAddress||false, showOrderBump: sv.showOrderBump||false,
      orderBumpText: sv.orderBumpText||'', orderBumpPrice: sv.orderBumpPrice||0,
      productImage: sv.productImage||(pr&&pr.image_url)||'',
      logoUrl: sv.logoUrl||(tenant&&tenant.logo_url)||'',
      theme: sv.theme||'light',
      primaryColor: sv.primaryColor||(tenant&&tenant.primary_color)||'#EF4444',
      buttonColor: sv.buttonColor||'', bgColor: sv.bgColor||'', textColor: sv.textColor||'',
      font: sv.font||'inter',
      cardBgColor: sv.cardBgColor||'', cardBorderColor: sv.cardBorderColor||'',
      cardLabelColor: sv.cardLabelColor||'', cardTextColor: sv.cardTextColor||'',
      cardTitleColor: sv.cardTitleColor||'', cardDescColor: sv.cardDescColor||'',
      inputBgColor: sv.inputBgColor||'', inputBorderColor: sv.inputBorderColor||'',
      stepBgColor: sv.stepBgColor||'', stepTextColor: sv.stepTextColor||'',
      cardBorderRadius: sv.cardBorderRadius||'', buttonBorderRadius: sv.buttonBorderRadius||'',
      fieldBorderRadius: sv.fieldBorderRadius||'', stepBorderRadius: sv.stepBorderRadius||'',
    };
    applyCSS(cfg);
    // Render shell
    var shell = '';
    if (cfg.showTimer) shell += '<div class="timer-banner">Oferta termina em: <b id="timer-val">00h : '+String(cfg.timerMinutes).padStart(2,'0')+'m : 00s</b></div>';
    if (cfg.logoUrl) {
      shell += '<div class="logo-header"><img src="'+cfg.logoUrl+'" alt="Logo" /><span class="safe">'+I.shieldSm+' Pagamento 100% seguro</span></div>';
    }
    shell += '<div class="co" id="co"></div>';
    app.innerHTML = shell;
    if (cfg.showTimer) startTimer(cfg.timerMinutes||15);
    document.title = cfg.productName || 'Checkout';
    render();
  }

  init();
})();
</script>
</body>
</html>
